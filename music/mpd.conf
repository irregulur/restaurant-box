# /etc/mpd.conf — headless mpd for restaurant background music.
# The only line that usually needs editing is audio_output.device (see `aplay -l`).

music_directory     "/srv/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/mpd.db"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"
log_file            "syslog"
user                "mpd"

bind_to_address     "127.0.0.1"
port                "6600"

auto_update         "yes"
filesystem_charset  "UTF-8"

audio_output {
    type            "alsa"
    name            "Speakers"
    # `aplay -l` -> "card N: ID [long name]". Use the ID: hw:PCH,0 for the onboard
    # jack, hw:CODEC,0 for a USB DAC, hw:HDMI,3 for HDMI. hw:N,0 (the number) also
    # works but shifts if you plug something else in later.
    device          "hw:PCH,0"
    mixer_type      "software"       # most USB DACs and onboard codecs have no usable hw mixer
    auto_resample   "no"
    auto_format     "no"
}

# Even volume between tracks (needs rsgain/loudgain tags; harmless if absent)
replaygain          "track"
replaygain_preamp   "0.0"
volume_normalization "no"

decoder {
    plugin          "ffmpeg"
    enabled         "yes"
}
