# /etc/go2rtc/go2rtc.yaml
# Runs on the node that sits on the DVR's own LAN (site B).
# View: http://<that-node>:1984/streams.html   (browser, no plugin, WebRTC)

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  # If WebRTC fails over Tailscale, uncomment and put the node's tailscale IP here:
  # candidates:
  #   - 100.101.102.103:8555

log:
  level: info
  format: text

streams:
  # `subtype=1` (Dahua) / `102` (Hikvision) / `sub` = low-bandwidth sub stream.
  # Main streams are for the on-site monitor; sub streams are for WAN viewing.
  cam1: rtsp://admin:PASSWORD@192.168.1.50:554/cam/realmonitor?channel=1&subtype=1
  cam2: rtsp://admin:PASSWORD@192.168.1.50:554/cam/realmonitor?channel=2&subtype=1
  cam3: rtsp://admin:PASSWORD@192.168.1.50:554/cam/realmonitor?channel=3&subtype=1
  cam4: rtsp://admin:PASSWORD@192.168.1.50:554/cam/realmonitor?channel=4&subtype=1

  # H.265 DVR? force a browser-friendly transcode (costs CPU on the node):
  # cam5: rtsp://.../cam/realmonitor?channel=5&subtype=1#video=h264

  # Hikvision example:
  # cam1: rtsp://admin:PASSWORD@192.168.1.50:554/Streaming/Channels/102
