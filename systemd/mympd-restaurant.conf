# /etc/systemd/system/mympd.service.d/restaurant.conf
# Plain http on :8080 for the staff phones and the Music button. mympd's default is
# ssl=true, which turns :8080 into a redirect to https://…:8443 — a port the firewall
# does not open, and a certificate warning no employee should have to click through.
# mympd re-reads MYMPD_* on every start and they override its config files.
[Service]
Environment=MYMPD_HTTP=true MYMPD_HTTP_PORT=8080 MYMPD_SSL=false
